<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Switcher Premium</title>
    <!-- Nhúng Google Font Inter cho giao diện hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #020617;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --iframe-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header & Controls */
        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            animation: fadeInDown 0.6s ease-out;
        }

        .title-section h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .title-section p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .radio-group {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 9999px;
            gap: 4px;
            position: relative;
        }

        .radio-option {
            position: relative;
            cursor: pointer;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .radio-option .label-btn {
            display: inline-block;
            padding: 8px 20px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: 9999px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .radio-option input:checked+.label-btn {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .radio-option:hover .label-btn:not(input:checked + .label-btn) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* WebView Container */
        .webview-container {
            flex: 1;
            background: var(--iframe-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .webview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            transition: opacity 0.3s ease;
        }

        .webview-iframe.loading {
            opacity: 0;
        }

        /* Loading Indicator */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--iframe-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s;
            opacity: 0;
            visibility: hidden;
        }

        .loader-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Warning Banner */
        .security-note {
            font-size: 0.75rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        /* Animations */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Controls Panel -->
        <div class="controls-panel">
            <div class="title-section">
                <h1>Web View Switcher</h1>
                <p>Chọn nguồn hiển thị bên dưới</p>
            </div>

            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="webview-source" value="http://localhost:8002/demo" checked>
                    <span class="label-btn">Front view</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="webview-source" value="http://localhost:8001/ui">
                    <span class="label-btn">driver view</span>
                </label>
            </div>
        </div>

        <!-- WebView Container -->
        <div class="webview-container">
            <!-- Loader -->
            <div id="loader" class="loader-overlay active">
                <div class="spinner"></div>
                <div class="loader-text">Đang tải trang...</div>
            </div>

            <!-- The Iframe acting as Webview -->
            <iframe id="webview" src="banner.webp" class="webview-iframe" allowfullscreen
                sandbox="allow-same-origin allow-scripts allow-popups allow-forms">
            </iframe>
        </div>

        <!-- Security Alert -->
        <div class="security-note">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            <span>Lưu ý: Một số trang web lớn (Google, Facebook, YouTube) chặn nhúng iframe bảo mật (X-Frame-Options).
                Hãy chọn trang hỗ trợ nhúng hoặc API nội bộ.</span>
        </div>
    </div>

    <script>
        const webview = document.getElementById('webview');
        const loader = document.getElementById('loader');
        const radioButtons = document.querySelectorAll('input[name="webview-source"]');

        // Hàm đổi trang và hiển thị loader
        function navigateTo(url) {
            loader.classList.add('active');
            webview.classList.add('loading');
            webview.src = url;
        }

        // Lắng nghe sự kiện load của iframe để ẩn loader
        webview.addEventListener('load', () => {
            loader.classList.remove('active');
            webview.classList.remove('loading');
        });

        // Lắng nghe thay đổi trên radio button
        radioButtons.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.checked) {
                    navigateTo(e.target.value);
                }
            });
        });
    </script>

</body>

</html>
