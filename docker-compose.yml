version: "3.9"

# =====================================================================
# MULTIMODAL-ADAS — Docker Compose (Local Dev / Full Stack)
#
# ADR-006 (2026-07-11): camera-service merged into driver-service.
#   Driver-service now opens the webcam directly and runs the full
#   AI pipeline in-process.  Only driver.results go through RabbitMQ.
# =====================================================================

networks:
  adas-net:
    driver: bridge

services:

  # ─── RabbitMQ ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: adas-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - adas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: adas-api-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DRIVER_SERVICE_URL:    http://driver-service:8001
      LANE_SERVICE_URL:      http://lane-service:8002
      AGGREGATOR_SERVICE_URL: http://aggregator-service:8003
      VEHICLE_SERVICE_URL:   http://vehicle-service:8004
      CAMERA_SERVICE_URL:    http://driver-service:8001
    depends_on:
      - aggregator-service
    networks:
      - adas-net
    restart: unless-stopped

  # ─── Aggregator ───────────────────────────────────────────────────
  aggregator-service:
    build:
      context: ./services/aggregator-service
    container_name: adas-aggregator
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
    networks:
      - adas-net
    restart: unless-stopped

  # ─── Driver Service (webcam + AI pipeline — ADR-006) ──────────────
  driver-service:
    build:
      context: ./services/driver-service
    container_name: adas-driver
    ports:
      - "8001:8001"
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
      JPEG_QUALITY: ${JPEG_QUALITY:-85}
      FRAME_WIDTH: ${FRAME_WIDTH:-640}
      FRAME_HEIGHT: ${FRAME_HEIGHT:-480}
      MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-2}
      EAR_THRESHOLD: ${EAR_THRESHOLD:-0.22}
      DROWSY_FRAMES: ${DROWSY_FRAMES:-60}
      SLIDING_WINDOW_SIZE: ${SLIDING_WINDOW_SIZE:-90}
      MODEL_PATH: face_landmarker.task
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: /
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - adas-net
    restart: unless-stopped

  # ─── Seatbelt Service ─────────────────────────────────────────────
  seatbelt-service:
    build:
      context: ./services/seatbelt_service
    container_name: adas-seatbelt
    ports:
      - "8007:8007"
    environment:
      PORT: 8007
      MODEL_PATH: best.pt
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.3}
      WARNING_FRAMES: ${WARNING_FRAMES:-10}
      POLL_INTERVAL: ${POLL_INTERVAL:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: /
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      AGGREGATOR_URL: http://aggregator-service:8003/event
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - adas-net
    restart: unless-stopped

  # ─── Lane Service ─────────────────────────────────────────────────
  lane-service:
    build:
      context: ./services/lane-service
    container_name: adas-lane
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      AGGREGATOR_URL: http://aggregator-service:8003/event
    networks:
      - adas-net
    depends_on:
      - aggregator-service
    restart: unless-stopped

  # ─── Vehicle Service ──────────────────────────────────────────────
  vehicle-service:
    build:
      context: ./services/vehicle-service
    container_name: adas-vehicle
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      AGGREGATOR_URL: http://aggregator-service:8003/event
    networks:
      - adas-net
    depends_on:
      - aggregator-service
    restart: unless-stopped

  # ─── Video Service ────────────────────────────────────────────────
  video-service:
    build:
      context: ./services/video-service
    container_name: adas-video
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      AGGREGATOR_URL: http://aggregator-service:8003/event
    networks:
      - adas-net
    depends_on:
      - aggregator-service
    restart: unless-stopped
